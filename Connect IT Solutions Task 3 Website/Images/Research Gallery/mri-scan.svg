  <ellipse cx="450" cy="300" rx="123" ry="145" fill="none" stroke="#eaf2ef" stroke-width="9" opacity=".6"/>
  <path d="M450 159c-52 17-82 58-87 115-3 42 20 58 13 93-5 24-27 49-13 71 17 26 58 4 87 1 29 3 70 25 87-1 14-22-8-47-13-71-7-35 16-51 13-93-5-57-35-98-87-115Z" fill="#1b3646" stroke="#ecf4f0" stroke-width="5"/>
