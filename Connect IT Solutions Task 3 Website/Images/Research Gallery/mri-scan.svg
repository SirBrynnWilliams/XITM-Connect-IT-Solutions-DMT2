<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative MRI scan visualisation</title>
  <desc id="desc">A stylised axial head scan displayed in a diagnostic imaging interface.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071724"/><stop offset="1" stop-color="#173a52"/></linearGradient>
    <radialGradient id="scan"><stop stop-color="#dee9e9"/><stop offset=".35" stop-color="#a4b4b5"/><stop offset=".67" stop-color="#5d727d"/><stop offset=".85" stop-color="#d6e0dd"/><stop offset="1" stop-color="#536a79"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="900" height="600" fill="url(#bg)"/>
  <g fill="none" stroke="#70c9d4" opacity=".5"><path d="M55 85h90M55 85v90M845 515h-90M845 515v-90"/><path d="M72 119h118M72 151h70"/></g>
  <rect x="184" y="62" width="532" height="476" rx="24" fill="#0b2030" stroke="#42677b" stroke-width="3"/>
