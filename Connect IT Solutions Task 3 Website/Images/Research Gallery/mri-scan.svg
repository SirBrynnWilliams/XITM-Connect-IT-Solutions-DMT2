  <g fill="#9fe5e4" font-family="Arial,sans-serif" font-size="15"><text x="216" y="94">MR IMAGING / AXIAL VIEW</text><text x="216" y="513">ILLUSTRATIVE VISUALISATION</text><text x="628" y="94">T1 · 01</text></g>
