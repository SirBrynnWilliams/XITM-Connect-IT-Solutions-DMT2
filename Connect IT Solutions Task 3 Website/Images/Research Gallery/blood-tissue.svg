    <ellipse cx="557" cy="168" rx="62" ry="38" transform="rotate(-12 557 168)"/><ellipse cx="765" cy="117" rx="68" ry="41" transform="rotate(28 765 117)"/>
    <ellipse cx="211" cy="300" rx="75" ry="43" transform="rotate(17 211 300)"/><ellipse cx="454" cy="300" rx="69" ry="42" transform="rotate(-20 454 300)"/>
    <ellipse cx="699" cy="313" rx="77" ry="45" transform="rotate(12 699 313)"/><ellipse cx="95" cy="472" rx="65" ry="39"/>
    <ellipse cx="378" cy="487" rx="77" ry="44" transform="rotate(-15 378 487)"/><ellipse cx="625" cy="475" rx="70" ry="42" transform="rotate(24 625 475)"/>
  </g>
  <g fill="#563066" opacity=".8"><ellipse cx="132" cy="144" rx="14" ry="9"/><ellipse cx="333" cy="104" rx="16" ry="9"/><ellipse cx="557" cy="168" rx="15" ry="9"/><ellipse cx="765" cy="117" rx="16" ry="10"/><ellipse cx="211" cy="300" rx="17" ry="10"/><ellipse cx="454" cy="300" rx="16" ry="10"/><ellipse cx="699" cy="313" rx="17" ry="11"/><ellipse cx="95" cy="472" rx="15" ry="9"/><ellipse cx="378" cy="487" rx="17" ry="10"/><ellipse cx="625" cy="475" rx="16" ry="10"/></g>
