<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative blood tissue microscopy</title>
  <desc id="desc">A stylised stained tissue section with red and violet cellular structures.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#250d2e"/><stop offset="1" stop-color="#792b50"/></linearGradient>
    <radialGradient id="cell"><stop stop-color="#f5b0c4"/><stop offset=".65" stop-color="#d85c87"/><stop offset="1" stop-color="#75264f"/></radialGradient>
    <pattern id="grain" width="38" height="38" patternUnits="userSpaceOnUse"><circle cx="4" cy="8" r="2" fill="#ffd7e7" opacity=".35"/><circle cx="25" cy="28" r="1.6" fill="#c7a4e0" opacity=".42"/></pattern>
  </defs>
  <rect width="900" height="600" fill="url(#bg)"/>
  <path d="M0 380Q145 290 280 365T560 340T900 325V600H0Z" fill="#a84268" opacity=".64"/>
  <g fill="url(#cell)" stroke="#f0abc3" stroke-width="4">
